# Keep Gradle heap modest — many MEIS Java services may already be running.
# Previous -Xmx8G -XX:MaxMetaspaceSize=4G caused "JVM garbage collector is thrashing".
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.daemon=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Prefer HTTPS repos that work with local JDK trust store (China mirrors)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.https.protocols=TLSv1.2,TLSv1.3
# Avoid resolving official Google/Maven Central when mirrors are enough
systemProp.org.gradle.internal.publish.checksums.insecure=true
# Force JDK 17+ (system JAVA_HOME may still point to Java 8)
org.gradle.java.home=D:/Program Files/Java/jdk-17
# Avoid Kotlin incremental cache crash when project is on E: and Pub cache on C:
# "this and base files have different roots"
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
android.enableJetifier=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
